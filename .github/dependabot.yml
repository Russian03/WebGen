# Un solo package-lock.json en la raíz (npm workspaces): un solo PR por semana
# para todas las webs.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ["*"]
